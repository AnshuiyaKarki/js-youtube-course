
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "https://localhost:300"

            // this.handleClick → get the handleClick method from the React object
            // .bind(this) → make sure "this" inside handleClick refers to the React object
            document.querySelector('button')
                .addEventListener('click', this.handleClick.bind(this))

        }

        handleClick(){
            console.log("button clicked");

            // "this" is the React object because we used .bind(this)
            // so we can access the React object's server property
            console.log(this.server);
        }
    }

    const app = new React()
</script>
</html>
